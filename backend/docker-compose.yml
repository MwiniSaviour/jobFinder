services:
  db:
    image: postgis/postgis:17-3.5
    container_name: jobfinder-db
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder_dev
      POSTGRES_DB: jobfinder
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - jobfinder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  jobfinder-db-data:
